# =============================================================================
# coturn TURN/STUN 服务配置（跨公网/NAT 无直连路径时中继）
# 配合 docker-compose.yml 使用；裸机部署放 /etc/turnserver.conf
# 客户端侧 ICE 配置（服务端零改动）：
#   --stun stun:<公网IP>:3478 --turn turn:<公网IP>:3478 --turn-user <u> --turn-pass <p>
# =============================================================================

# —— 监听 ——
listening-port=3478                 # STUN/TURN UDP+TCP
tls-listening-port=5349             # TURN-TLS（严格网络用 turns:...:5349 或 443）
listening-ip=0.0.0.0
# 云主机在 NAT 后必配（公网 IP）；有公网网卡则填本机公网 IP
external-ip=YOUR_PUBLIC_IP
# relay-ip 通常同内网 IP；多网卡按实际情况填
# relay-ip=10.0.0.5

# —— 中继端口段（防火墙必须放行 UDP）——
min-port=49160
max-port=49200

# —— 协议 ——
fingerprint                          # ICE fingerprint 校验
no-tlsv1
no-tlsv1_1
# 多进程/多线程
# relay-threads=4

# —— 认证：REST 时效凭据（推荐）——
# 密钥与 deploy/turn/gen-credential.js 使用同一个 secret
use-auth-secret
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_STRING
realm=video.meeting

# —— TLS（turns: 需要；证书挂载见 docker-compose.yml）——
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
# pkey-password=...

# —— 限流与运维 ——
total-quota=200                      # 最大会话数
user-quota=12                        # 单 IP 会话数
no-cli                               # 禁用 CLI（安全）
# stale-nonce=600
# mobility

# —— 日志 ——
log-file=stdout
verbose
